
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Dashboard | Resume Builder</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Additional mobile responsiveness */

        @media screen and (max-width: 600px) {

            body {
                overflow-x: hidden;
            }

            header {
                padding: 15px 18px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .container,
            .page {
                width: 100%;
                padding-left: 15px;
                padding-right: 15px;
            }

            h1 {
                font-size: 27px;
                line-height: 1.3;
            }

            h2 {
                font-size: 21px;
            }

            input,
            textarea,
            select {
                font-size: 16px;
                max-width: 100%;
            }

            button,
            .btn,
            .create-btn {
                max-width: 100%;
            }

            .form-card,
            .box,
            .card {
                padding: 20px 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .resume {
                flex-direction: column;
                align-items: flex-start;
            }

            .resume-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .resume-actions a,
            .resume-actions button {
                flex: 1;
            }

            .actions {
                flex-wrap: wrap;
            }

            textarea {
                min-height: 110px;
            }
        }

        @media screen and (max-width: 380px) {

            .brand {
                font-size: 20px;
            }

            .welcome {
                padding: 20px;
            }

            .resume-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .resume-actions a,
            .resume-actions form,
            .resume-actions button {
                width: 100%;
            }
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f6ff;
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: #101a31;
            color: white;
            padding: 19px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
        }

        .brand span { color: #8b9cff; }

        .logout {
            background: #293754;
            color: white;
            border: 1px solid #455575;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .logout:hover { background: #405172; }

        .container {
            max-width: 1050px;
            margin: 45px auto;
            padding: 0 22px 50px;
        }

        .welcome {
            background: linear-gradient(120deg, #5269e8, #7958d9);
            color: white;
            padding: 35px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 12px 30px rgba(82, 105, 232, 0.20);
        }

        .welcome h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #e4e8ff;
            font-size: 14px;
        }

        .create-btn {
            display: inline-block;
            background: white;
            color: #5269e8;
            padding: 13px 20px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.2s;
        }

        .create-btn:hover { transform: translateY(-2px); }

        .section-heading {
            margin: 38px 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-heading h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 23px;
        }

        .section-heading span {
            color: #7b8498;
            font-size: 13px;
        }

        .card {
            background: white;
            padding: 25px;
            border: 1px solid #e8eaff;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(34, 48, 90, 0.05);
        }

        .resume {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .resume:last-child { border-bottom: none; }

        .resume-info h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            margin-bottom: 7px;
        }

        .resume-info p {
            color: #7b8498;
            font-size: 13px;
        }

        .resume-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            padding: 10px 17px;
            border-radius: 8px;
            background: #e9ecff;
            color: #5269e8;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .btn:hover { background: #dce1ff; }

        .delete {
            background: #fff0f0;
            color: #dc4545;
        }

        .delete:hover { background: #ffe0e0; }

        .empty {
            text-align: center;
            padding: 45px 15px;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: #8794ec;
        }

        .empty h3 {
            font-family: 'Outfit', sans-serif;
            margin-bottom: 9px;
        }

        .empty p {
            color: #7b8498;
            font-size: 14px;
            margin-bottom: 20px;
        }

        @media(max-width: 650px) {
            header { padding: 18px 20px; }

            .container { margin-top: 25px; }

            .welcome {
                flex-direction: column;
                align-items: flex-start;
                padding: 26px;
            }

            .welcome h1 { font-size: 25px; }

            .resume {
                flex-direction: column;
                align-items: flex-start;
            }

            .resume-actions { width: 100%; }

            .resume-actions a,
            .resume-actions button { flex: 1; text-align: center; }

            .section-heading span { display: none; }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">Resume<span>Builder.</span></div>

    <a th:href="@{/logout/confirm}" class="logout"
       style="text-decoration:none; display:inline-block;">
        Logout ↗
    </a>
</header>

<main class="container">

    <section class="welcome">
        <div>
            <h1>Welcome, <span th:text="${username}"></span>!</h1>
            <p>Your professional journey starts with a great resume.</p>
        </div>

        <a th:href="@{/resume/new}" class="create-btn">
            + Create New Resume
        </a>
    </section>

    <div class="section-heading">
        <h2>My Resumes</h2>
        <span>Manage your saved resumes</span>
    </div>

    <section class="card">

        <div th:if="${#lists.isEmpty(resumes)}" class="empty">
            <div class="empty-icon">▤</div>
            <h3>No Resumes Yet</h3>
            <p>Create your first professional resume to get started.</p>

            <a th:href="@{/resume/new}" class="btn">
                Create My First Resume →
            </a>
        </div>

        <div th:each="resume : ${resumes}" class="resume">

            <div class="resume-info">
                <h3 th:text="${resume.name}"></h3>
                <p th:text="${resume.email}"></p>
            </div>

            <div class="resume-actions">
                <a th:href="@{/resume/{id}/edit(id=${resume.id})}"
                   class="btn">
                    Edit
                </a>
                <a th:href="@{/resume/{id}(id=${resume.id})}"
                   class="btn">
                    View Resume
                </a>

                <form th:action="@{/resume/{id}/delete(id=${resume.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to permanently delete this resume? This action cannot be undone.');">

                    <button type="submit" class="btn delete">
                        Delete
                    </button>

                </form>

            </div>

        </div>

    </section>

</main>

</body>
</html>
