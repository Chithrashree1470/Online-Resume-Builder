
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Resume Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {font-family:Arial;background:#f1f5f9;text-align:center;padding:60px 15px}
        .box {background:white;padding:35px;border-radius:12px;max-width:350px;margin:auto}
        input,button {width:100%;padding:13px;margin:10px 0;box-sizing:border-box}
        button {background:#2563eb;color:white;border:0;border-radius:6px}
    </style>
</head>
<body>
<div class="box">
    <h1>Welcome Back!</h1>
    <p th:if="${param.registered}">Registration successful. Please login.</p>
    <p th:if="${param.error}">Invalid username or password.</p>

    <form th:action="@{/login}" method="post">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <a href="/register">Create an account</a>
</div>
</body>
</html>
