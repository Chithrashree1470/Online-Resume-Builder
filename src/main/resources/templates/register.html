
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Resume Builder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 60px 15px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            max-width: 400px;
            margin: auto;
        }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error { color: red; }
    </style>
</head>

<body>

<div class="box">

    <h1>Create Account</h1>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password (minimum 8 characters)"
               minlength="8"
               required>

        <button type="submit">Register</button>

    </form>

    <a th:href="@{/login}">Already have an account? Login</a>

</div>

</body>
</html>
