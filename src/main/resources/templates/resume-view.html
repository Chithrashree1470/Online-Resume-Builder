
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Preview | Resume Builder</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        /* Additional mobile responsiveness */

        @media screen and (max-width: 600px) {

            body {
                overflow-x: hidden;
            }

            header {
                padding: 15px 18px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .container,
            .page {
                width: 100%;
                padding-left: 15px;
                padding-right: 15px;
            }

            h1 {
                font-size: 27px;
                line-height: 1.3;
            }

            h2 {
                font-size: 21px;
            }

            input,
            textarea,
            select {
                font-size: 16px;
                max-width: 100%;
            }

            button,
            .btn,
            .create-btn {
                max-width: 100%;
            }

            .form-card,
            .box,
            .card {
                padding: 20px 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .resume {
                flex-direction: column;
                align-items: flex-start;
            }

            .resume-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .resume-actions a,
            .resume-actions button {
                flex: 1;
            }

            .actions {
                flex-wrap: wrap;
            }

            textarea {
                min-height: 110px;
            }
        }

        @media screen and (max-width: 380px) {

            .brand {
                font-size: 20px;
            }

            .welcome {
                padding: 20px;
            }

            .resume-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .resume-actions a,
            .resume-actions form,
            .resume-actions button {
                width: 100%;
            }
        }

        body {
            margin: 0;
            padding: 35px 18px;
            font-family: 'DM Sans', sans-serif;
            background: #eef0f8;
            color: #263247;
        }

        .actions {
            max-width: 800px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 19px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .back {
            background: white;
            color: #5269e8;
            border: 1px solid #e0e5f0;
        }

        .download {
            background: linear-gradient(135deg, #5269e8, #7958d9);
            color: white;
        }

        .resume {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 55px 60px;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(34, 48, 90, 0.10);
        }

        .resume-header {
            border-bottom: 3px solid #5869e8;
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 34px;
            color: #17213b;
            margin: 0 0 14px;
            overflow-wrap: anywhere;
        }

        .contact {
            color: #667085;
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .section {
            margin-bottom: 28px;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            color: #5269e8;
            font-size: 17px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #e5e9f2;
            padding-bottom: 9px;
            margin-bottom: 14px;
        }

        .section p {
            color: #4b5568;
            font-size: 14px;
            line-height: 1.9;
            white-space: pre-line;
            overflow-wrap: anywhere;
            margin: 0;
        }

        .empty-value {
            color: #a0a8b7 !important;
            font-style: italic;
        }

        @media(max-width: 600px) {
            body { padding: 18px 10px; }

            .resume { padding: 30px 23px; }

            h1 { font-size: 27px; }

            .actions { flex-wrap: wrap; }

            .btn { text-align: center; }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .actions { display: none; }

            .resume {
                box-shadow: none;
                border-radius: 0;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="actions">

    <a th:href="@{/dashboard}" class="btn back">
        ← Back to Dashboard
    </a>

    <a th:href="@{/resume/{id}/download(id=${resume.id})}"
       class="btn download">
        Download PDF ↓
    </a>

</div>

<main class="resume">

    <div class="resume-header">

        <h1 th:text="${resume.name}"></h1>

        <div class="contact">
            <div th:text="${resume.email}"></div>
            <div th:text="${resume.phone}"></div>
        </div>

    </div>

    <section class="section">
        <h2>Skills</h2>
        <p th:if="${resume.skills != null and !#strings.isEmpty(resume.skills)}"
           th:text="${resume.skills}"></p>
        <p th:if="${resume.skills == null or #strings.isEmpty(resume.skills)}"
           class="empty-value">No skills added.</p>
    </section>

    <section class="section">
        <h2>Education</h2>
        <p th:if="${resume.education != null and !#strings.isEmpty(resume.education)}"
           th:text="${resume.education}"></p>
        <p th:if="${resume.education == null or #strings.isEmpty(resume.education)}"
           class="empty-value">No education details added.</p>
    </section>

    <section class="section">
        <h2>Projects</h2>
        <p th:if="${resume.projects != null and !#strings.isEmpty(resume.projects)}"
           th:text="${resume.projects}"></p>
        <p th:if="${resume.projects == null or #strings.isEmpty(resume.projects)}"
           class="empty-value">No projects details added.</p>
    </section>

</main>

</body>
</html>
